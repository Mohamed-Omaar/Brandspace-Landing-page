name: Scale Creative Studio Large

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scale-creative-large.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enlarge creative studio section
        run: python scale_creative_large.py

      - name: Commit resize
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase creative studio section size"
          git push
