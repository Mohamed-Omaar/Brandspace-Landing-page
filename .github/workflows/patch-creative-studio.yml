name: Patch Creative Studio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-creative-studio.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply creative studio redesign
        run: python patch_creative.py

      - name: Commit creative studio redesign
        run: |
          git config user.name "BrandSpace Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Redesign creative studio preview"
          git push
