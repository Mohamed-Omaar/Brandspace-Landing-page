name: Scale Creative Studio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scale-creative-studio.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enlarge creative studio visual
        run: python scale_creative.py

      - name: Commit size adjustment
        run: |
          git config user.name "BrandSpace Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enlarge creative studio section"
          git push
