<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f4f4">
<title>BrandSpace — Full Product + Brand Brain Preview</title>
<link rel="icon" type="image/svg+xml" href="/brandspace-logo.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f4;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#preview{display:block;width:100%;height:100%;border:0;background:#f4f4f4}
.back{position:fixed;z-index:9999;top:18px;left:18px;display:none;align-items:center;gap:9px;height:44px;padding:0 16px;border:0;border-radius:14px;background:#111114;color:#fff;font:700 12px/1 Inter,ui-sans-serif,sans-serif;box-shadow:0 12px 34px rgba(17,17,20,.18);cursor:pointer}.back.show{display:inline-flex}.back:hover{transform:translateY(-1px)}
@media(max-width:720px){.back{top:12px;left:12px;height:40px;padding:0 13px;border-radius:12px}}
</style>
</head>
<body>
<button class="back" id="backToDemo" type="button">← Back to product demo</button>
<iframe id="preview" src="/demo/" title="BrandSpace complete product preview"></iframe>
<script>
const frame=document.getElementById('preview');
const back=document.getElementById('backToDemo');
const DEMO='/demo/';
const BRAIN='/brand-brain-preview/';
function isCustomerNav(doc){return !!doc.querySelector('[data-view-target="brand"]')||(doc.getElementById('experienceName')?.textContent||'').toLowerCase().includes('customer');}
function addBrandBrain(doc){
  if(!doc||!doc.body||!isCustomerNav(doc)||doc.getElementById('brandBrainIntegratedNav')) return;
  const brandKit=doc.querySelector('[data-view-target="brand"]');
  if(!brandKit) return;
  const btn=brandKit.cloneNode(true);
  btn.id='brandBrainIntegratedNav';
  btn.removeAttribute('data-view-target');
  btn.removeAttribute('aria-current');
  btn.setAttribute('data-label','Brand Brain');
  btn.classList.remove('active');
  const icon=btn.querySelector('.nav-icon'); if(icon) icon.textContent='◇';
  const spans=btn.querySelectorAll('span'); if(spans[1]) spans[1].textContent='Brand Brain';
  const badge=btn.querySelector('.nav-badge'); if(badge) badge.textContent='preview';
  btn.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();frame.src=BRAIN;});
  brandKit.parentNode.insertBefore(btn,brandKit);
}
function wireDemo(){
  let doc; try{doc=frame.contentDocument}catch(e){return}
  if(!doc) return;
  addBrandBrain(doc);
  const nav=doc.getElementById('navList');
  if(nav){const observer=new MutationObserver(()=>addBrandBrain(doc));observer.observe(nav,{childList:true,subtree:true});}
}
function updateShell(){
  let path=''; try{path=frame.contentWindow.location.pathname}catch(e){}
  const inBrain=path.startsWith('/brand-brain-preview');
  back.classList.toggle('show',inBrain);
  if(!inBrain) wireDemo();
}
frame.addEventListener('load',updateShell);
back.addEventListener('click',()=>{frame.src=DEMO;});
</script>
</body>
</html>
