<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f4f4">
<title>BrandSpace — Full Product + Brand Brain Preview</title>
<link rel="icon" type="image/svg+xml" href="/brandspace-logo.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f4;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#preview{display:block;width:100%;height:100%;border:0;background:#f4f4f4}
</style>
</head>
<body>
<iframe id="preview" src="/demo/" title="BrandSpace complete product preview"></iframe>
<script>
const frame=document.getElementById('preview');

function isCustomerNav(doc){
  return !!doc.querySelector('[data-view-target="brand"]') ||
    (doc.getElementById('experienceName')?.textContent||'').toLowerCase().includes('customer');
}

function ensureIntegrationStyle(doc){
  if(doc.getElementById('brandBrainIntegrationStyle')) return;
  const style=doc.createElement('style');
  style.id='brandBrainIntegrationStyle';
  style.textContent=`
    .brand-brain-route{width:100%;min-height:calc(100vh - 112px);height:calc(100vh - 112px);border:0;border-radius:26px;background:#f3f3f5;display:block;box-shadow:0 18px 55px rgba(30,22,54,.06)}
    @media(max-width:760px){.brand-brain-route{min-height:calc(100vh - 86px);height:calc(100vh - 86px);border-radius:18px}}
  `;
  doc.head.appendChild(style);
}

function prepareEmbeddedBrain(innerFrame){
  const apply=()=>{
    let bdoc;
    try{bdoc=innerFrame.contentDocument}catch(e){return}
    if(!bdoc||!bdoc.head) return;
    if(bdoc.getElementById('brandBrainEmbeddedMode')) return;
    const style=bdoc.createElement('style');
    style.id='brandBrainEmbeddedMode';
    style.textContent=`
      html,body{background:#f3f3f5!important}
      body{overflow:auto!important}
      .app{display:block!important;grid-template-columns:1fr!important;padding:0!important;min-height:auto!important}
      .side,.topbar{display:none!important}
      .main{display:block!important;width:100%!important;min-width:0!important}
      .content{max-width:none!important;margin:0!important;padding:22px 22px 90px!important}
      .copilot{right:24px!important;bottom:24px!important}
      @media(max-width:650px){.content{padding:12px 10px 70px!important}.page-head{margin-top:14px!important}.hero{border-radius:24px!important}}
    `;
    bdoc.head.appendChild(style);
  };
  innerFrame.addEventListener('load',apply,{once:true});
  setTimeout(apply,80);
}

function setActiveBrain(doc,btn){
  doc.querySelectorAll('.nav-item').forEach(item=>{
    item.classList.remove('active');
    item.removeAttribute('aria-current');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-current','page');
}

function openBrandBrain(doc,btn){
  ensureIntegrationStyle(doc);
  setActiveBrain(doc,btn);

  const eyebrow=doc.getElementById('pageEyebrow');
  const title=doc.getElementById('pageTitle');
  if(eyebrow) eyebrow.textContent='Brand intelligence';
  if(title) title.textContent='Brand Brain';

  const view=doc.getElementById('view');
  if(!view) return;
  view.innerHTML='';
  const brain=doc.createElement('iframe');
  brain.className='brand-brain-route';
  brain.id='brandBrainRouteFrame';
  brain.src='/brand-brain-preview/?embedded=1';
  brain.title='Brand Brain';
  brain.setAttribute('loading','eager');
  view.appendChild(brain);
  prepareEmbeddedBrain(brain);

  const sidebar=doc.getElementById('sidebar');
  const backdrop=doc.getElementById('mobileBackdrop');
  if(sidebar) sidebar.classList.remove('mobile-open','open');
  if(backdrop) backdrop.classList.remove('show','active');
}

function addBrandBrain(doc){
  if(!doc||!doc.body||!isCustomerNav(doc)) return;
  let btn=doc.getElementById('brandBrainIntegratedNav');
  if(btn) return;

  const brandKit=doc.querySelector('[data-view-target="brand"]');
  if(!brandKit) return;

  btn=brandKit.cloneNode(true);
  btn.id='brandBrainIntegratedNav';
  btn.removeAttribute('data-view-target');
  btn.removeAttribute('aria-current');
  btn.setAttribute('data-label','Brand Brain');
  btn.classList.remove('active');

  const icon=btn.querySelector('.nav-icon');
  if(icon) icon.textContent='✦';
  const spans=btn.querySelectorAll('span');
  if(spans[1]) spans[1].textContent='Brand Brain';
  const badge=btn.querySelector('.nav-badge');
  if(badge) badge.textContent='preview';

  btn.addEventListener('click',(e)=>{
    e.preventDefault();
    e.stopPropagation();
    openBrandBrain(doc,btn);
  });

  brandKit.parentNode.insertBefore(btn,brandKit);
}

function wireDemo(){
  let doc;
  try{doc=frame.contentDocument}catch(e){return}
  if(!doc) return;

  addBrandBrain(doc);

  const nav=doc.getElementById('navList');
  if(nav){
    const observer=new MutationObserver(()=>addBrandBrain(doc));
    observer.observe(nav,{childList:true,subtree:true});
  }

  doc.addEventListener('click',(e)=>{
    const normalNav=e.target.closest?.('[data-view-target]');
    if(normalNav && !normalNav.closest('#brandBrainIntegratedNav')){
      const brainBtn=doc.getElementById('brandBrainIntegratedNav');
      if(brainBtn){brainBtn.classList.remove('active');brainBtn.removeAttribute('aria-current');}
    }
  },true);
}

frame.addEventListener('load',wireDemo);
</script>
</body>
</html>
