<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#f4f4f5" />
  <title>BrandSpace — Coming Soon</title>
  <meta name="description" content="BrandSpace is currently learning." />
  <link rel="canonical" href="https://www.brandspace.cc/" />
  <link rel="icon" type="image/svg+xml" href="/brandspace-logo.svg" />
  <style>
    :root{--ink:#111114;--muted:#74747d;--purple:#7935fe;--yellow:#ffdd15;--pink:#ff9fc3}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#f4f4f5}
    .ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#fbfbfb,#f2f2f3)}
    .ambient:before,.ambient:after{content:"";position:absolute;border-radius:50%;filter:blur(110px);opacity:.28}
    .ambient:before{width:55vw;height:55vw;left:-18vw;top:-22vw;background:var(--purple)}
    .ambient:after{width:55vw;height:55vw;right:-20vw;bottom:-24vw;background:var(--yellow)}
    .card{width:min(720px,calc(100% - 28px));padding:64px 42px;border-radius:34px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.8);box-shadow:0 28px 90px rgba(35,24,67,.11);backdrop-filter:blur(20px);text-align:center}
    .logo{display:flex;align-items:center;justify-content:center;gap:11px;font-weight:850;font-size:18px;letter-spacing:-.03em}
    .logo img{width:46px;height:46px;border-radius:15px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin-top:42px;color:var(--purple);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 5px rgba(121,53,254,.10)}
    h1{margin:18px auto 14px;max-width:600px;font-size:clamp(48px,8vw,82px);line-height:.92;letter-spacing:-.07em;font-weight:780}
    h1 strong{display:block;color:var(--purple)}
    p{margin:0;color:var(--muted);font-size:15px}
    .dots{display:flex;justify-content:center;gap:7px;margin-top:34px}
    .dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.18;animation:pulse 1.35s ease-in-out infinite}
    .dots i:nth-child(2){animation-delay:.16s;background:var(--purple)}
    .dots i:nth-child(3){animation-delay:.32s;background:var(--yellow)}
    @keyframes pulse{0%,100%{transform:translateY(0);opacity:.18}50%{transform:translateY(-7px);opacity:1}}
    @media(max-width:600px){.card{padding:48px 22px;border-radius:28px}.logo img{width:42px;height:42px}h1{font-size:clamp(44px,15vw,64px)}}
    @media(prefers-reduced-motion:reduce){.dots i{animation:none}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="card">
    <div class="logo"><img src="/brandspace-logo.svg" alt="BrandSpace" /><span>BrandSpace</span></div>
    <span class="eyebrow">Coming soon</span>
    <h1>BrandSpace is<br><strong>currently learning.</strong></h1>
    <p>Something intelligent is taking shape.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
